[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcompress-cli"
version = "0.1.1"
authors = [
  { name = "Shubham Sharma", email = "shubham@list2shop.com" },
]
description = "A multi-tier interactive and scriptable PDF compression CLI tool"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["pdf", "compression", "optimizer", "cli", "pypdf", "pillow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pypdf>=4.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
pdfcompress = "pdf_compressor.cli:main"

[project.urls]
"Homepage" = "https://github.com/uchiha-fire/pdf-compressor"
"Repository" = "https://github.com/uchiha-fire/pdf-compressor"
"Bug Tracker" = "https://github.com/uchiha-fire/pdf-compressor/issues"
"Documentation" = "https://github.com/uchiha-fire/pdf-compressor#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_compressor*"]
